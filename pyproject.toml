[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-q --cov=api --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["api/tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["api/__init__.py", "api/tests/*"]

[tool.coverage.report]
exclude_also = [
  'if __name__ == "__main__":',
]
show_missing = true
fail_under = 100
